<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المصروفات — Admin</title>
  <link rel="stylesheet" href="css/style.css?v=20260515_v2">
  <style>
    .expenses-form-container {
      background: #eef4ff;
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 32px;
    }
    .expenses-form-header {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
      text-align: right;
    }
    .expenses-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }
    .form-group input, .form-group textarea {
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1rem;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .submit-btn {
      width: 100%;
      background: #002b80;
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .submit-btn:hover {
      opacity: 0.9;
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .expenses-log-header {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      text-align: right;
    }
    
    .expense-card {
      background: #eef4ff;
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-right: 4px solid #002b80;
    }
    
    .expense-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .expense-date {
      font-size: 0.85rem;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .expense-notes {
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
    }
    .expense-amount {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
    }
  </style>
</head>
<body class="is-loading">

      </div>
      <button class="sidebar-toggle" style="position:absolute; top:20px; left:20px; background:none; border:none; font-size:1.5rem; cursor:pointer; color:#475569;">☰</button>
      
      <nav class="admin-nav">

        <a href="customers">

        </a>

    <main class="admin-main">
      <div style="max-width:600px; margin: 0 auto;">
        
        <div class="expenses-form-container">
          <div class="expenses-form-header">تسجيل المصروفات</div>
          <form id="expense-form">
            <div class="expenses-grid">
              <div class="form-group">
                <label>المصروفات</label>
                <input type="number" id="expense-amount" placeholder="0.00" required step="0.01">
              </div>
              <div class="form-group">
                <label>التاريخ</label>
                <input type="date" id="expense-date" required>
              </div>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
              <label>الملاحظات</label>
              <textarea id="expense-notes" placeholder="تفاصيل المصروف..."></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">
              إضافة مصروف <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </form>
        </div>

        <div class="expenses-log-header">سجل المصروفات</div>
        <div id="expenses-log-container">
          <!-- Expense cards will be inserted here -->
        </div>

      </div>
    </main>
  </div>

  <script src="js/api-v2.js?v=20260515_v2"></script>
  <script src="js/auth-v2.js?v=20260515_v2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAdmin()) return;
      document.body.classList.remove('is-loading');

      // Set default date to today
      document.getElementById('expense-date').valueAsDate = new Date();

      const form = document.getElementById('expense-form');
      const submitBtn = document.getElementById('submit-btn');
      const logContainer = document.getElementById('expenses-log-container');

      function renderExpenses(expenses) {
        if (!expenses || expenses.length === 0) {
          logContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">لا توجد مصروفات مسجلة.</div>';
          return;
        }

        logContainer.innerHTML = expenses.reverse().map(exp => `
          <div class="expense-card">
            <div class="expense-info">
              <div class="expense-date">
                ${exp['التاريخ'] || ''}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
              <div class="expense-notes">${exp['ملاحظات'] || ''}</div>
            </div>
            <div class="expense-amount">${exp['المصروفات'] || '0.00'}</div>
          </div>
        `).join('');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const amount = document.getElementById('expense-amount').value;
        const date = document.getElementById('expense-date').value;
        const notes = document.getElementById('expense-notes').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'جاري الإضافة... <div class="spinner" style="width: 18px; height: 18px; border-width: 2px;"></div>';

        try {
          const response = await fetch('https://usefradi-n8n.hf.space/webhook/Expense', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              "sheet": "Expense",
              "expense": Number(amount),
              "Date": date,
              "Notes": notes
            })
          });

          if (response.ok) {
            const data = await response.json();
            showToast('تم تسجيل المصروف بنجاح', 'success');
            renderExpenses(data);
            
            // Reset form partly
            document.getElementById('expense-amount').value = '';
            document.getElementById('expense-notes').value = '';
          } else {
            throw new Error('Failed to submit');
          }
        } catch (error) {
          console.error('Error submitting expense:', error);
          showToast('حدث خطأ أثناء تسجيل المصروف', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'إضافة مصروف <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
        }
      });
    });
  </script>
