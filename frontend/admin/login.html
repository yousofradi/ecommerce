<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>تسجيل الدخول — لوحة التحكم</title>
  <link rel="stylesheet" href="css/style.css?v=20260515_v2">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body, #f8fafc);
      padding: 20px;
    }
    .login-card {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 40px 32px;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .login-input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-input:focus {
      border-color: var(--primary, #0f766e);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    .pwd-toggle {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .pwd-toggle:hover {
      color: #475569;
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body class="login-container">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:30px">
      <div id="login-brand-logo" style="margin-bottom:16px; color:var(--primary, #0f766e); height:56px; display:flex; align-items:center; justify-content:center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block; margin:0 auto;"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <h1 style="font-size:1.45rem;font-weight:700;color:#1e293b;margin-bottom:6px"><span class="store-name-text">لوحة التحكم</span></h1>
      <p class="text-muted" style="font-size:0.92rem;color:#64748b;">قم بتسجيل الدخول للوصول إلى النظام</p>
    </div>

    <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
      <div class="form-group" style="margin-bottom:18px">
        <label class="form-label" for="username" style="font-weight:600;margin-bottom:6px;display:block;font-size:0.9rem;">اسم المستخدم</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="username" class="login-input" placeholder="اسم المستخدم" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:20px">
        <label class="form-label" for="password" style="font-weight:600;margin-bottom:6px;display:block;font-size:0.9rem;">كلمة المرور</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="password" class="login-input" style="padding-left:40px" placeholder="••••••••••••" required autocomplete="current-password">
          <button type="button" class="pwd-toggle" onclick="togglePasswordVisibility()" title="إظهار / إخفاء">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div id="login-error" style="color:#ef4444;background:#fef2f2;border:1px solid #fecaca;padding:10px 14px;border-radius:8px;font-size:0.88rem;margin-bottom:16px;display:none;align-items:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
        <span id="error-message">اسم المستخدم أو كلمة المرور غير صحيحة</span>
      </div>

      <button type="submit" class="btn btn-primary login-btn" id="login-btn">
        <span>تسجيل الدخول</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      </button>
    </form>
  </div>

  <script src="js/api-v2.js?v=20260515_v2"></script>
  <script>
    // If already logged in, redirect
    if (localStorage.getItem('adminKey')) {
      window.location.href = 'index';
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const eye = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
      } else {
        pwd.type = 'password';
        eye.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }
    }

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('login-error');
      const errMsg = document.getElementById('error-message');

      if (!username || !password) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin:0 6px;"></span> جاري التحقق...';
      errBox.style.display = 'none';

      try {
        const res = await api.login(username, password);

        if (res && res.success && res.token) {
          localStorage.setItem('adminKey', res.token);
          localStorage.setItem('adminUser', JSON.stringify(res.user || {}));
          localStorage.setItem('adminPermissions', JSON.stringify(res.user.permissions || {}));
          localStorage.setItem('loginTimestamp', Date.now().toString());

          // Decide target redirect page
          const perms = res.user.permissions || {};
          const isSuper = res.user.role === 'superadmin' || res.user.isSuperAdmin;

          if (isSuper || perms.dashboard === 'full' || perms.dashboard === 'read') {
            window.location.href = 'index';
          } else {
            // Find first permitted section
            const sectionPages = {
              orders: 'orders',
              abandoned_carts: 'abandoned-carts',
              customers: 'customers',
              products: 'products',
              collections: 'collections',
              homepage: 'homepage',
              promotions: 'promotions',
              expenses: 'expenses',
              settings: 'settings',
              shipment: 'shipment',
              webhooks: 'webhooks',
              whatsapp: 'whatsapp',
              employees: 'employees'
            };

            let targetPage = 'index';
            for (const [sec, page] of Object.entries(sectionPages)) {
              if (perms[sec] === 'full' || perms[sec] === 'read') {
                targetPage = page;
                break;
              }
            }
            window.location.href = targetPage;
          }
        } else {
          throw new Error(res.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
        }
      } catch (err) {
        localStorage.removeItem('adminKey');
        localStorage.removeItem('adminUser');
        localStorage.removeItem('adminPermissions');
        errMsg.textContent = err.message || 'اسم المستخدم أو كلمة المرور غير صحيحة';
        errBox.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '<span>تسجيل الدخول</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>';
      }
    }
  </script>
</body>
</html>
